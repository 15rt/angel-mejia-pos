<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ángel Mejía - Sistema POS</title>
    
    <!-- Configuración PWA con Icono HD -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/10149/10149458.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/10149/10149458.png">

    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- html5-qrcode para Escáner -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f4f6f9;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        [data-bs-theme="dark"] body {
            background-color: #0f172a;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            color: #f8fafc;
        }

        .card-custom {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        [data-bs-theme="dark"] .card-custom {
            background: rgba(30, 41, 59, 0.85);
            border-color: rgba(51, 65, 85, 0.8);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-theme-toggle {
            border-radius: 50px;
            padding: 5px 15px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        #reader {
            border-radius: 12px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- Navbar con Icono HD, Botón Permanente de Instalación y Modo Oscuro -->
    <nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container-fluid container d-flex justify-content-between align-items-center">
            <span class="navbar-brand mb-0 h1 d-flex align-items-center gap-2">
                <img src="https://cdn-icons-png.flaticon.com/512/10149/10149458.png" width="30" height="30" alt="Logo POS">
                ÁNGEL MEJÍA - POS
            </span>
            <div class="d-flex align-items-center gap-2">
                <button id="btn-install-navbar" class="btn btn-warning btn-sm fw-bold rounded-pill shadow-sm" onclick="instalarAppManual()">
                    📲 Instalar App
                </button>
                <button class="btn btn-outline-light btn-theme-toggle d-flex align-items-center gap-1" onclick="toggleTheme()" id="btn-theme">
                    <i class="bi bi-moon-stars-fill"></i> <span id="theme-label">Modo Oscuro</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        
        <!-- Banner de Instalación PWA (Respaldo) -->
        <div id="pwa-install-banner" class="alert alert-warning border-0 shadow-sm text-center mb-4 card-custom">
            <p class="mb-2 fw-bold text-dark">📲 ¿Quieres tener la App en tu pantalla de inicio?</p>
            <button class="btn btn-primary fw-bold shadow-sm" onclick="instalarAppManual()">
                ➕ Instalar Ángel Mejía POS
            </button>
        </div>

        <!-- Módulo Tasa BCV -->
        <div class="card card-custom mb-4 border-0">
            <div class="card-body text-center p-4">
                <h5 class="card-title text-muted fw-semibold mb-2">🏦 Tasa Oficial BCV</h5>
                <h2 class="display-5 fw-bold text-primary my-2" id="tasa-bcv">Cargando...</h2>
                <p class="text-muted small mb-3" id="sync-time">Última sync: -</p>
                <button class="btn btn-outline-primary btn-sm rounded-pill px-3" onclick="obtenerTasaBCV()">🔄 Sincronizar BCV</button>
            </div>
        </div>

        <!-- Escáner de Código de Barras -->
        <div class="card card-custom mb-4 border-0">
            <div class="card-body p-4">
                <h5 class="card-title mb-3 fw-bold">📷 Escanear Producto</h5>
                <div id="reader" style="width: 100%; min-height: 250px; background-color: #f8f9fa; display: none;" class="rounded border mb-3"></div>
                <button id="btn-scan" class="btn btn-warning w-100 fw-bold text-white shadow-sm py-2" onclick="toggleCamara()">
                    📷 ¡Escanea producto aquí!
                </button>
            </div>
        </div>

        <!-- Formulario de Registro de Producto -->
        <div class="card card-custom mb-4 border-0">
            <div class="card-body p-4">
                <h5 class="card-title mb-3 fw-bold">➕ Registrar Producto</h5>
                <form id="form-producto" onsubmit="guardarProducto(event)">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Código de Barras</label>
                        <input type="text" id="codigo" class="form-control" placeholder="Escanea o escribe el código" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nombre del Producto</label>
                        <input type="text" id="nombre" class="form-control" placeholder="Ej: Harina Pan 1kg" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Precio en Dólares ($)</label>
                        <input type="number" step="0.01" id="precio" class="form-control" placeholder="1.20" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 fw-bold py-2">💾 Guardar / Agregar</button>
                </form>
            </div>
        </div>

        <!-- Tabla de Inventario -->
        <div class="card card-custom border-0">
            <div class="card-body p-4">
                <h5 class="card-title mb-3 fw-bold">🛒 Inventario de Productos</h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Producto</th>
                                <th>Precio ($)</th>
                                <th>Precio (Bs)</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-productos">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Modo Oscuro / Claro
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-bs-theme', newTheme);
            
            const btn = document.getElementById('btn-theme');
            if (newTheme === 'dark') {
                btn.innerHTML = '<i class="bi bi-sun-fill"></i> <span id="theme-label">Modo Claro</span>';
            } else {
                btn.innerHTML = '<i class="bi bi-moon-stars-fill"></i> <span id="theme-label">Modo Oscuro</span>';
            }
            localStorage.setItem('pos-theme', newTheme);
        }

        const savedTheme = localStorage.getItem('pos-theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', savedTheme);

        // Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('SW activo', reg))
                    .catch(err => console.error('Error SW', err));
            });
        }

        // Lógica de Instalación PWA (Botón Fijo)
        let deferredPrompt = null;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        async function instalarAppManual() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('App instalada con éxito');
                }
                deferredPrompt = null;
            } else {
                alert("Para instalar la aplicación manualmente:\n\n1. Toca los 3 puntos de Chrome arriba a la derecha.\n2. Selecciona 'Agregar a la pantalla principal' o 'Instalar aplicación'.");
            }
        }

        // Lógica POS y BCV
        let tasaActual = 0;
        let html5QrcodeScanner = null;
        let productos = [];

        async function obtenerTasaBCV() {
            const tasaElemento = document.getElementById('tasa-bcv');
            tasaElemento.innerText = "Consultando...";
            try {
                const res = await fetch('/api/bcv');
                const data = await res.json();
                if (data.tasa) {
                    tasaActual = data.tasa;
                    tasaElemento.innerText = `Bs. ${tasaActual.toFixed(2)}`;
                    document.getElementById('sync-time').innerText = `Última sync: ${new Date().toLocaleTimeString()}`;
                    actualizarTabla();
                } else {
                    tasaElemento.innerText = "Error BCV";
                }
            } catch (err) {
                console.error("Error cargando BCV:", err);
                tasaElemento.innerText = "Error BCV";
            }
        }

        function toggleCamara() {
            const readerDiv = document.getElementById('reader');
            if (readerDiv.style.display === 'none') {
                readerDiv.style.display = 'block';
                html5QrcodeScanner = new Html5Qrcode("reader");
                html5QrcodeScanner.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 150 } },
                    (decodedText) => {
                        document.getElementById('codigo').value = decodedText;
                        html5QrcodeScanner.stop().then(() => {
                            readerDiv.style.display = 'none';
                        });
                        buscarOAutoFormular(decodedText);
                    },
                    (errorMessage) => { }
                ).catch(err => console.error("Error cámara:", err));
            } else {
                if (html5QrcodeScanner) {
                    html5QrcodeScanner.stop().then(() => {
                        readerDiv.style.display = 'none';
                    });
                }
            }
        }

        function buscarOAutoFormular(codigoScanned) {
            const prodEncontrado = productos.find(p => p.codigo === codigoScanned);
            if (prodEncontrado) {
                document.getElementById('nombre').value = prodEncontrado.nombre;
                document.getElementById('precio').value = prodEncontrado.precio;
            }
        }

        function guardarProducto(e) {
            e.preventDefault();
            const codigo = document.getElementById('codigo').value;
            const nombre = document.getElementById('nombre').value;
            const precio = parseFloat(document.getElementById('precio').value);

            const index = productos.findIndex(p => p.codigo === codigo);
            if (index !== -1) {
                productos[index] = { codigo, nombre, precio };
            } else {
                productos.push({ codigo, nombre, precio });
            }

            actualizarTabla();
            document.getElementById('form-producto').reset();
        }

        function actualizarTabla() {
            const tbody = document.getElementById('tabla-productos');
            tbody.innerHTML = '';

            if (productos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-3">No hay productos registrados aún.</td></tr>`;
                return;
            }

            productos.forEach(p => {
                const precioBs = tasaActual ? (p.precio * tasaActual).toFixed(2) : '0.00';
                tbody.innerHTML += `
                    <tr>
                        <td><code>${p.codigo}</code></td>
                        <td>${p.nombre}</td>
                        <td>$${p.precio.toFixed(2)}</td>
                        <td class="fw-bold text-success">Bs. ${precioBs}</td>
                    </tr>
                `;
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            obtenerTasaBCV();
        });
    </script>
</body>
</html>
