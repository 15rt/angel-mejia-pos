<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Ángel Mejía POS">
  <meta name="theme-color" content="#1a365d">
  <title>Ángel Mejía - Sistema POS</title>
  
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: Roboto, 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; color: #1c1e21; }
    
    header { background: #1a365d; color: white; padding: 18px 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    header h1 { margin: 0; font-size: 1.7rem; }
    header p { margin: 4px 0 0 0; color: #cbd5e0; font-size: 0.9rem; }

    .main-container { max-width: 1100px; margin: 15px auto; padding: 0 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

    .card { background: white; border-radius: 12px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 15px; }
    .card h2 { margin-top: 0; font-size: 1.1rem; color: #2d3748; border-bottom: 2px solid #edf2f7; padding-bottom: 8px; }

    .tasa-box { background: #ebf8ff; border-left: 5px solid #3182ce; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
    .tasa-box h3 { margin: 0; color: #2b6cb0; font-size: 1.5rem; }
    .tasa-status { font-size: 0.8rem; color: #4a5568; margin-top: 4px; }

    .scanner-trigger-btn {
      background: linear-gradient(135deg, #dd6b20, #c05621);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 10px;
      width: 100%;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 4px 12px rgba(221, 107, 32, 0.3);
      animation: pulse-border 2s infinite;
    }

    .scanner-icon {
      font-size: 1.5rem;
      display: inline-block;
      animation: scan-bounce 1.5s infinite ease-in-out;
    }

    @keyframes scan-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    @keyframes pulse-border {
      0% { box-shadow: 0 0 0 0 rgba(221, 107, 32, 0.6); }
      70% { box-shadow: 0 0 0 10px rgba(221, 107, 32, 0); }
      100% { box-shadow: 0 0 0 0 rgba(221, 107, 32, 0); }
    }

    #reader {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 15px;
      display: none;
      border: 2px dashed #dd6b20;
    }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 6px; color: #4a5568; }
    
    input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 16px; outline: none; background-color: #fff; }
    
    button { background: #319795; color: white; border: none; padding: 14px; border-radius: 8px; width: 100%; font-weight: bold; font-size: 1rem; cursor: pointer; }
    .btn-bcv { background: #3182ce; }

    .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; margin-top: 5px; min-width: 320px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #edf2f7; font-size: 0.85rem; }
    th { background: #f7fafc; color: #4a5568; }
    .price-ves { color: #2b6cb0; font-weight: bold; }

    @media (max-width: 768px) {
      .main-container { grid-template-columns: 1fr; margin: 10px auto; padding: 0 10px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>💻 ÁNGEL MEJÍA - SISTEMA POS</h1>
    <p>Solución Inteligente de Ventas e Inventario</p>
  </header>

  <div class="main-container">
    <div>
      <div class="card">
        <h2>🏛️ Tasa Oficial BCV</h2>
        <div class="tasa-box">
          <h3 id="tasaDisplay">Sincronizando...</h3>
          <div class="tasa-status" id="statusDisplay">Conectando con BCV...</div>
        </div>
        <button type="button" class="btn-bcv" onclick="sincronizarBCV()">🔄 Sincronizar BCV</button>
      </div>

      <div class="card">
        <h2>📷 Escanear Producto</h2>
        <button type="button" class="scanner-trigger-btn" onclick="toggleCamara()">
          <span class="scanner-icon">📷</span>
          <span>¡Escanea producto aquí!</span>
        </button>
        <div id="reader"></div>
      </div>

      <div class="card">
        <h2>➕ Registrar Producto</h2>
        <form id="nuevoProductoForm">
          <div class="form-group">
            <label>Código de Barras</label>
            <input type="text" id="regCodigo" placeholder="Escanea o escribe el código" required>
          </div>
          <div class="form-group">
            <label>Nombre del Producto</label>
            <input type="text" id="regNombre" placeholder="Ej: Harina Pan 1kg" required>
          </div>
          <div class="form-group">
            <label>Precio en Dólares ($)</label>
            <input type="number" step="0.01" id="regPrecio" placeholder="1.20" required>
          </div>
          <div class="form-group">
            <label>Stock Inicial</label>
            <input type="number" id="regStock" value="20" required>
          </div>
          <button type="submit">Guardar Producto</button>
        </form>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>🛒 Procesar Venta</h2>
        <form id="ventaForm">
          <div class="form-group">
            <label>Producto Seleccionado</label>
            <select id="productoSelect" required></select>
          </div>
          <div class="form-group">
            <label>Cantidad</label>
            <input type="number" id="cantidadInput" min="1" value="1" required>
          </div>
          <button type="submit">Cobrar Venta</button>
        </form>
      </div>

      <div class="card">
        <h2>📦 Productos en Sistema</h2>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Código</th>
                <th>Producto</th>
                <th>$</th>
                <th>Bs (BCV)</th>
              </tr>
            </thead>
            <tbody id="inventarioTabla"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    let tasaActual = 0;
    let html5QrCode = null;
    let camaraActiva = false;

    async function cargarDatos() {
      try {
        const resInfo = await fetch('/api/info');
        const info = await resInfo.json();
        tasaActual = info.tasaBCV;
        
        const tasaFormateada = tasaActual.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        document.getElementById('tasaDisplay').innerText = `Bs. ${tasaFormateada} / USD`;
        document.getElementById('statusDisplay').innerText = `Última sync: ${info.ultimaActualizacion}`;

        const resProductos = await fetch('/api/productos');
        const productos = await resProductos.json();
        
        const tabla = document.getElementById('inventarioTabla');
        const select = document.getElementById('productoSelect');
        
        tabla.innerHTML = '';
        select.innerHTML = '';

        productos.forEach(p => {
          const precioVESNumber = p.precioUSD * tasaActual;
          const precioVESFormateado = precioVESNumber.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
          
          tabla.innerHTML += `
            <tr>
              <td><small>${p.codigoBarras || 'S/C'}</small></td>
              <td><b>${p.nombre}</b></td>
              <td>$${p.precioUSD.toFixed(2)}</td>
              <td class="price-ves">Bs. ${precioVESFormateado}</td>
            </tr>
          `;

          select.innerHTML += `<option value="${p.id}" data-codigo="${p.codigoBarras}">${p.nombre} - $${p.precioUSD.toFixed(2)} (Bs. ${precioVESFormateado})</option>`;
        });
      } catch (error) {
        console.error("Error cargando datos:", error);
      }
    }

    async function toggleCamara() {
      const readerDiv = document.getElementById('reader');

      if (!camaraActiva) {
        readerDiv.style.display = 'block';
        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode("reader");
        }

        const config = { fps: 10, qrbox: { width: 250, height: 150 } };

        try {
          await html5QrCode.start(
            { facingMode: "environment" }, 
            config, 
            (decodedText) => {
              document.getElementById('regCodigo').value = decodedText;
              
              const select = document.getElementById('productoSelect');
              let encontrado = false;

              for (let i = 0; i < select.options.length; i++) {
                if (select.options[i].getAttribute('data-codigo') === decodedText) {
                  select.selectedIndex = i;
                  encontrado = true;
                  alert(`¡Producto escaneado!: ${select.options[i].text}`);
                  break;
                }
              }

              if (!encontrado) {
                alert(`Código escaneado: ${decodedText}\n\nNo está en el inventario. Puedes registrarlo abajo.`);
              }
            }
          );
          camaraActiva = true;
        } catch (err) {
          alert("Error al abrir la cámara. Revisa los permisos en tu navegador.");
          readerDiv.style.display = 'none';
        }
      } else {
        await html5QrCode.stop();
        readerDiv.style.display = 'none';
        camaraActiva = false;
      }
    }

    async function sincronizarBCV() {
      document.getElementById('tasaDisplay').innerText = "Sincronizando...";
      await fetch('/api/sincronizar-bcv', { method: 'POST' });
      cargarDatos();
    }

    document.getElementById('nuevoProductoForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nuevo = {
        codigoBarras: document.getElementById('regCodigo').value,
        nombre: document.getElementById('regNombre').value,
        precioUSD: parseFloat(document.getElementById('regPrecio').value),
        stock: parseInt(document.getElementById('regStock').value)
      };

      const res = await fetch('/api/productos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(nuevo)
      });

      if (res.ok) {
        alert("¡Producto registrado con éxito!");
        document.getElementById('nuevoProductoForm').reset();
        cargarDatos();
      }
    });

    document.getElementById('ventaForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const productoId = document.getElementById('productoSelect').value;
      const cantidad = document.getElementById('cantidadInput').value;

      const res = await fetch('/api/ventas', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ productoId, cantidad })
      });

      const data = await res.json();
      if(res.ok) {
        const totalVESFormateado = parseFloat(data.venta.totalVES).toLocaleString('es-VE', { minimumFractionDigits: 2 });
        alert(`¡Venta cobrada con éxito!\n\nTotal: Bs. ${totalVESFormateado} ($${data.venta.totalUSD})`);
        cargarDatos();
      } else {
        alert(data.error);
      }
    });

    cargarDatos();
  </script>
</body>
</html>
