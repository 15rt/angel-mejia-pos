<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ángel Mejía - Sistema POS</title>
    
    <!-- Configuración PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2965/2965306.png">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- html5-qrcode -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-light">

    <!-- Encabezado -->
    <nav class="navbar navbar-dark bg-primary mb-4 shadow">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">💻 ÁNGEL MEJÍA - POS</span>
            <span class="badge bg-light text-primary">Solución Inteligente</span>
        </div>
    </nav>

    <div class="container mb-5">
        
        <!-- Botón de Instalación PWA (Se muestra cuando Android lo detecta) -->
        <div id="pwa-install-banner" class="alert alert-info border-0 shadow-sm text-center mb-4" style="display: none;">
            <p class="mb-2 fw-bold">📲 ¡Instala esta aplicación en tu teléfono!</p>
            <button id="btn-install-pwa" class="btn btn-primary fw-bold shadow-sm">
                ➕ Instalar Ángel Mejía POS
            </button>
        </div>

        <!-- Bloque BCV -->
        <div class="card mb-4 shadow-sm border-0">
            <div class="card-body text-center">
                <h5 class="card-title text-muted">🏦 Tasa Oficial BCV</h5>
                <h2 class="display-5 fw-bold text-primary" id="tasa-bcv">Cargando...</h2>
                <p class="text-muted small mb-3" id="sync-time">Última sync: -</p>
                <button class="btn btn-outline-primary btn-sm" onclick="obtenerTasaBCV()">🔄 Sincronizar BCV</button>
            </div>
        </div>

        <!-- Escáner -->
        <div class="card mb-4 shadow-sm border-0">
            <div class="card-body">
                <h5 class="card-title mb-3">📷 Escanear Producto</h5>
                <div id="reader" style="width: 100%; min-height: 250px; background-color: #f8f9fa; display: none;" class="rounded border mb-3"></div>
                <button id="btn-scan" class="btn btn-warning w-100 fw-bold text-white shadow-sm" onclick="toggleCamara()">
                    📷 ¡Escanea producto aquí!
                </button>
            </div>
        </div>

        <!-- Registro manual / datos producto -->
        <div class="card mb-4 shadow-sm border-0">
            <div class="card-body">
                <h5 class="card-title mb-3">➕ Registrar Producto</h5>
                <form id="form-producto" onsubmit="guardarProducto(event)">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Código de Barras</label>
                        <input type="text" id="codigo" class="form-control" placeholder="Escanea o escribe el código" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nombre del Producto</label>
                        <input type="text" id="nombre" class="form-control" placeholder="Ej: Harina Pan 1kg" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Precio en Dólares ($)</label>
                        <input type="number" step="0.01" id="precio" class="form-control" placeholder="1.20" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 fw-bold">💾 Guardar / Agregar</button>
                </form>
            </div>
        </div>

        <!-- Tabla de Inventario / Carrito -->
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <h5 class="card-title mb-3">🛒 Inventario de Productos</h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Código</th>
                                <th>Producto</th>
                                <th>Precio ($)</th>
                                <th>Precio (Bs)</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-productos">
                            <!-- Productos dinámicos -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Registro del Service Worker para PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registrado con éxito', reg))
                    .catch(err => console.error('Error al registrar Service Worker', err));
            });
        }

        // Lógica del Botón de Instalación PWA
        let deferredPrompt;
        const pwaBanner = document.getElementById('pwa-install-banner');
        const installBtn = document.getElementById('btn-install-pwa');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            pwaBanner.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    pwaBanner.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        // Lógica de la aplicación
        let tasaActual = 0;
        let html5QrcodeScanner = null;

        async function obtenerTasaBCV() {
            try {
                const res = await fetch('/api/bcv');
                const data = await res.json();
                if (data.tasa) {
                    tasaActual = data.tasa;
                    document.getElementById('tasa-bcv').innerText = `Bs. ${tasaActual.toFixed(2)}`;
                    document.getElementById('sync-time').innerText = `Última sync: ${new Date().toLocaleTimeString()}`;
                    actualizarPreciosBs();
                }
            } catch (err) {
                console.error("Error cargando BCV:", err);
                document.getElementById('tasa-bcv').innerText = "Error BCV";
            }
        }

        function toggleCamara() {
            const readerDiv = document.getElementById('reader');
            if (readerDiv.style.display === 'none') {
                readerDiv.style.display = 'block';
                html5QrcodeScanner = new Html5Qrcode("reader");
                html5QrcodeScanner.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 150 } },
                    (decodedText) => {
                        document.getElementById('codigo').value = decodedText;
                        html5QrcodeScanner.stop();
                        readerDiv.style.display = 'none';
                    },
                    (errorMessage) => { }
                ).catch(err => console.error("Error al abrir cámara:", err));
            } else {
                if (html5QrcodeScanner) {
                    html5QrcodeScanner.stop().then(() => {
                        readerDiv.style.display = 'none';
                    });
                }
            }
        }

        let productos = [];

        function guardarProducto(e) {
            e.preventDefault();
            const codigo = document.getElementById('codigo').value;
            const nombre = document.getElementById('nombre').value;
            const precio = parseFloat(document.getElementById('precio').value);

            productos.push({ codigo, nombre, precio });
            actualizarTabla();

            document.getElementById('form-producto').reset();
        }

        function actualizarTabla() {
            const tbody = document.getElementById('tabla-productos');
            tbody.innerHTML = '';
            productos.forEach(p => {
                const precioBs = tasaActual ? (p.precio * tasaActual).toFixed(2) : '0.00';
                tbody.innerHTML += `
                    <tr>
                        <td><code>${p.codigo}</code></td>
                        <td>${p.nombre}</td>
                        <td>$${p.precio.toFixed(2)}</td>
                        <td class="fw-bold text-success">Bs. ${precioBs}</td>
                    </tr>
                `;
            });
        }

        function actualizarPreciosBs() {
            actualizarTabla();
        }

        // Cargar tasa al iniciar
        obtenerTasaBCV();
    </script>
</body>
</html>
